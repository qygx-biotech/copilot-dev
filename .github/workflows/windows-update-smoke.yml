name: Windows two-version update smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-update-smoke.yml"
      - "desktop/main/**"
      - "desktop/scripts/*windows*"
      - "desktop/test/windows-update-fixture/**"
      - "desktop/test/windows-beta-update-fixture/**"
      - "forge.config.cjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: windows-update-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-version-squirrel-update:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run updater and security tests
        run: npm run desktop:test

      - name: Build versions A and B with one Squirrel identity
        run: node desktop/scripts/build-windows-update-smoke.mjs

      - name: Install A, download B, restart normally, and verify retained data
        run: node desktop/scripts/windows-update-smoke.mjs

      - name: Build prerelease A and B with the production Squirrel identity
        run: node desktop/scripts/build-windows-beta-update-smoke.mjs

      - name: Trigger the narrow beta action, choose Later, and verify redirected installation
        run: node desktop/scripts/windows-beta-update-smoke.mjs
